<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Lecture OMR Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

.header {
    background: white;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.header h1 {
    margin: 0 0 12px;
    font-size: 21px;
}

.controls {
    display: flex;
    gap: 8px;
}

input[type="text"],
input[type="number"] {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 11px;
    font-size: 15px;
}

#lectureName {
    flex: 1;
    min-width: 0;
}

#questionCount {
    width: 85px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.create-btn {
    background: #111;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 10px;
}

.question {
    background: white;
    border-radius: 12px;
    padding: 13px;
    margin: 10px 0;
    box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.question-title {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 16px;
}

.answers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.answer {
    background: #edf0f3;
}

.answer.selected {
    background: #111;
    color: white;
}

.status {
    display: flex;
    margin-top: 10px;
    gap: 20px;
}

.status label {
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.status input {
    width: 19px;
    height: 19px;
}

.result {
    display: none;
    background: white;
    padding: 17px;
    border-radius: 13px;
    margin: 10px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.result h2 {
    margin-top: 0;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.stat {
    padding: 13px;
    background: #f1f3f5;
    border-radius: 10px;
}

.stat strong {
    display: block;
    font-size: 25px;
    margin-top: 3px;
}

.bottom {
    position: sticky;
    bottom: 0;
    background: white;
    padding: 10px;
    display: flex;
    gap: 8px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.12);
}

.reset {
    background: #e4e7ea;
}

.submit {
    flex: 1;
    background: #111;
    color: white;
    font-size: 16px;
}

@media (max-width: 400px) {
    .controls {
        flex-wrap: wrap;
    }

    #lectureName {
        width: 100%;
        flex-basis: 100%;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>📝 Lecture OMR Tracker</h1>

    <div class="controls">

        <input
            type="text"
            id="lectureName"
            placeholder="Lecture / Test name"
        >

        <input
            type="number"
            id="questionCount"
            value="100"
            min="1"
            max="300"
        >

        <button
            class="create-btn"
            onclick="createQuestions()"
        >
            Create
        </button>

    </div>

</div>

<div class="container">

    <div class="result" id="result">

        <h2>📊 Result</h2>

        <div class="stats">

            <div class="stat">
                ✅ Correct
                <strong id="correct">0</strong>
            </div>

            <div class="stat">
                ❌ Wrong
                <strong id="wrong">0</strong>
            </div>

            <div class="stat">
                ⭕ Unattempted
                <strong id="unattempted">0</strong>
            </div>

            <div class="stat">
                📋 Attempted
                <strong id="attempted">0</strong>
            </div>

        </div>

        <p>
            🎯 Accuracy:
            <strong id="accuracy">0%</strong>
        </p>

    </div>

    <div id="questions"></div>

</div>

<div class="bottom">

    <button
        class="reset"
        onclick="resetAll()"
    >
        Reset
    </button>
