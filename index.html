<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Lecture OMR Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

.header {
    background: white;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.header h1 {
    margin: 0 0 12px;
    font-size: 21px;
}

.controls {
    display: flex;
    gap: 8px;
}

input[type="text"],
input[type="number"] {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 11px;
    font-size: 15px;
}

#lectureName {
    flex: 1;
    min-width: 0;
}

#questionCount {
    width: 85px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.create-btn {
    background: #111;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 10px;
}

.question {
    background: white;
    border-radius: 12px;
    padding: 13px;
    margin: 10px 0;
    box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.question-title {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 16px;
}

.answers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.answer {
    background: #edf0f3;
}

.answer.selected {
    background: #111;
    color: white;
}

.status {
    display: flex;
    margin-top: 10px;
    gap: 8px;
}

.status button {
    flex: 1;
}

.correct-btn {
    background: #d8f3dc;
}

.correct-btn.selected {
    background: #16803c;
    color: white;
}

.wrong-btn {
    background: #ffdada;
}

.wrong-btn.selected {
    background: #c62828;
    color: white;
}

.result {
    display: none;
    background: white;
    padding: 17px;
    border-radius: 13px;
    margin: 10px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.result h2 {
    margin-top: 0;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.stat {
    padding: 13px;
    background: #f1f3f5;
    border-radius: 10px;
}

.stat strong {
    display: block;
    font-size: 25px;
    margin-top: 3px;
}

.bottom {
    position: sticky;
    bottom: 0;
    background: white;
    padding: 10px;
    display: flex;
    gap: 8px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.12);
}

.reset {
    background: #e4e7ea;
}

.submit {
    flex: 1;
    background: #111;
    color: white;
    font-size: 16px;
}

@media (max-width: 400px) {
    .controls {
        flex-wrap: wrap;
    }

    #lectureName {
        width: 100%;
        flex-basis: 100%;
    }

    #questionCount {
        flex: 1;
    }

    .create-btn {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>📝 Lecture OMR Tracker</h1>

    <div class="controls">

        <input
            type="text"
            id="lectureName"
            placeholder="Lecture / Test name"
        >

        <input
            type="number"
            id="questionCount"
            value="100"
            min="1"
            max="300"
        >

        <button
            class="create-btn"
            onclick="createQuestions()"
        >
            Create
        </button>

    </div>

</div>

<div class="container">

    <div class="result" id="result">

        <h2>📊 Result</h2>

        <div class="stats">

            <div class="stat">
                ✅ Correct
                <strong id="correct">0</strong>
            </div>

            <div class="stat">
                ❌ Wrong
                <strong id="wrong">0</strong>
            </div>

            <div class="stat">
                ⭕ Unattempted
                <strong id="unattempted">0</strong>
            </div>

            <div class="stat">
                📋 Attempted
                <strong id="attempted">0</strong>
            </div>

        </div>

        <p>
            🎯 Accuracy:
            <strong id="accuracy">0%</strong>
        </p>

    </div>

    <div id="questions"></div>

</div>

<div class="bottom">

    <button
        class="reset"
        onclick="resetAll()"
    >
        Reset
    </button>

    <button
        class="submit"
        onclick="calculateResult()"
    >
        Submit / Calculate Result
    </button>

</div>

<script>

function createQuestions() {

    const lectureName =
        document.getElementById("lectureName").value.trim();

    const count =
        parseInt(document.getElementById("questionCount").value);

    if (!lectureName) {
        alert("Please enter a lecture or test name.");
        return;
    }

    if (!count || count < 1 || count > 300) {
        alert("Please enter a question count between 1 and 300.");
        return;
    }

    const questionsContainer =
        document.getElementById("questions");

    questionsContainer.innerHTML = "";

    document.getElementById("result").style.display = "none";

    for (let i = 1; i <= count; i++) {

        const question = document.createElement("div");

        question.className = "question";

        question.innerHTML = `

            <div class="question-title">
                Question ${i}
            </div>

            <div class="answers">

                <button
                    class="answer"
                    onclick="selectAnswer(this)"
                >
                    A
                </button>

                <button
                    class="answer"
                    onclick="selectAnswer(this)"
                >
                    B
                </button>

                <button
                    class="answer"
                    onclick="selectAnswer(this)"
                >
                    C
                </button>

                <button
                    class="answer"
                    onclick="selectAnswer(this)"
                >
                    D
                </button>

            </div>

            <div class="status">

                <button
                    class="correct-btn"
                    onclick="selectStatus(this, 'correct')"
                >
                    ✅ Correct
                </button>

                <button
                    class="wrong-btn"
                    onclick="selectStatus(this, 'wrong')"
                >
                    ❌ Wrong
                </button>

            </div>

        `;

        questionsContainer.appendChild(question);
    }

    window.scrollTo({
        top: document.querySelector(".container").offsetTop,
        behavior: "smooth"
    });
}


function selectAnswer(button) {

    const parent =
        button.parentElement;

    const buttons =
        parent.querySelectorAll(".answer");

    buttons.forEach(function(btn) {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
}


function selectStatus(button, status) {

    const parent =
        button.parentElement;

    const correctButton =
        parent.querySelector(".correct-btn");

    const wrongButton =
        parent.querySelector(".wrong-btn");

    correctButton.classList.remove("selected");
    wrongButton.classList.remove("selected");

    button.classList.add("selected");
}


function calculateResult() {

    const questions =
        document.querySelectorAll(".question");

    if (questions.length === 0) {
        alert("Please create the questions first.");
        return;
    }

    let correct = 0;
    let wrong = 0;
    let unattempted = 0;

    questions.forEach(function(question) {

        const correctButton =
            question.querySelector(".correct-btn");

        const wrongButton =
            question.querySelector(".wrong-btn");

        if (correctButton.classList.contains("selected")) {

            correct++;

        } else if (wrongButton.classList.contains("selected")) {

            wrong++;

        } else {

            unattempted++;

        }

    });

    const attempted =
        correct + wrong;

    let accuracy = 0;

    if (attempted > 0) {
        accuracy =
            ((correct / attempted) * 100).toFixed(2);
    }

    document.getElementById("correct").textContent =
        correct;

    document.getElementById("wrong").textContent =
        wrong;

    document.getElementById("unattempted").textContent =
        unattempted;

    document.getElementById("attempted").textContent =
        attempted;

    document.getElementById("accuracy").textContent =
        accuracy + "%";

    document.getElementById("result").style.display =
        "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function resetAll() {

    const confirmed =
        confirm("Are you sure you want to reset everything?");

    if (!confirmed) {
        return;
    }

    document.getElementById("lectureName").value = "";

    document.getElementById("questionCount").value = 100;

    document.getElementById("questions").innerHTML = "";

    document.getElementById("result").style.display = "none";

    document.getElementById("correct").textContent = "0";

    document.getElementById("wrong").textContent = "0";

    document.getElementById("unattempted").textContent = "0";

    document.getElementById("attempted").textContent = "0";

    document.getElementById("accuracy").textContent = "0%";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>

</body>
</html>
